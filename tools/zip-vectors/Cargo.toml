[package]
name = "zip-backup-vectors"
version = "0.1.0"
edition = "2021"
publish = false
description = "Test vectors for the FROST member backup ZIP draft, checked against Zkool's code"

[dependencies]
anyhow = "1"
bech32 = "0.11"
blake2b_simd = "1.0.4"
blake3 = "1"
ff = "0.14"
hex = "0.4"
orchard = { version = "=0.16.0", default-features = false, features = ["std"] }
pasta_curves = "0.6"
rand_chacha = "0.3"
rand_core = "0.6"
reddsa = { version = "=0.5.2", features = ["frost"] }
serde_json = "1"
zcash_address = "=0.14.0"
zcash_protocol = "=0.11.0"
