name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      # Reading QR codes from images (the webcam backend builds on Windows).
      - name: Tests with the camera
        if: matrix.os == 'windows-latest'
        run: cargo test --locked --features camera --lib camera

      # Sign, prove with the Ironwood circuit and extract a whole transaction.
      - name: Last mile (release)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --locked --test extract -- --ignored

      - name: Library without the command-line tool
        run: cargo clippy --locked --lib --no-default-features -- -D warnings

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit
