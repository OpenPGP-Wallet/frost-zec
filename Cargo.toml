[package]
name = "frost-zec"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Versions pinned to the ones zcash-devtool uses, so that the PCZTs it writes
# parse here and the PCZTs written here go back to it unchanged.
[dependencies]
blake2b_simd = "1.0.4"
blake3 = "1"
ff = "0.13"
frost-rerandomized = "=3.0.0"
hex = "0.4"
orchard = { version = "=0.15.3", default-features = false, features = ["std", "unstable-frost"] }
pasta_curves = "0.5.1"
pczt = { version = "=0.9.3", features = ["signer", "tx-extractor"] }
rand = "0.8"
reddsa = { version = "=0.5.2", features = ["frost"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zcash_address = "=0.13.0"
zcash_primitives = { version = "=0.30.1", default-features = false }
zcash_protocol = "=0.10.5"
