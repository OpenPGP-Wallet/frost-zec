[package]
name = "frost-zec"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "FROST threshold signing for shielded ZEC: DKG, ZIP 2005 group keys, re-randomized PCZT signing, co-signer checks and member backup strings"
repository = "https://github.com/OpenPGP-Wallet/frost-zec"
readme = "README.md"
keywords = ["zcash", "frost", "threshold", "pczt", "orchard"]
categories = ["cryptography", "cryptography::cryptocurrencies"]
# Only the code, its test fixtures and the docs go into the package. Never the
# prototype's key storage (data/), signing sessions or local PCZT files.
include = ["/src/**", "/tests/fixtures/**", "/docs/**", "/README.md", "/LICENSE", "/CONTRIBUTING.md"]

# The NU7 releases of the Zcash libraries (2026-10-21). PCZTs keep the same
# encoding as before, so files from zcash-devtool still parse here and go back
# to it unchanged.
[dependencies]
bech32 = "0.11"
blake2b_simd = "1.0.4"
blake3 = "1"
chacha20poly1305 = "0.11.0"
ff = "0.14"
frost-rerandomized = "=3.0.0"
hex = "0.4"
minicbor = { version = "2.3.1", features = ["derive", "alloc"] }
orchard = { version = "=0.16.0", default-features = false, features = ["std", "unstable-frost"] }
pasta_curves = "0.6"
pczt = { version = "=0.10.0", features = ["signer", "tx-extractor"] }
# FROST (reddsa 0.5.2) still takes rand 0.8; the Zcash libraries take rand_core 0.10.
rand = "0.8"
rand10 = { package = "rand", version = "0.10", default-features = false, features = ["sys_rng"] }
reddsa = { version = "=0.5.2", features = ["frost"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ur = "0.5.2"
x-wing = { version = "0.1.1", features = ["zeroize"] }
zcash_address = "=0.14.0"
zcash_primitives = { version = "=0.31.0", default-features = false }
zcash_protocol = "=0.11.0"
zeroize = "1"

[dev-dependencies]
pczt = { version = "=0.10.0", features = ["io-finalizer", "zcp-builder", "signer"] }
rand = "0.8"
zcash_primitives = { version = "=0.31.0", default-features = false, features = ["std"] }
zcash_protocol = "=0.11.0"
